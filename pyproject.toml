[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flexibilling"
dynamic = ["version"]
description = "Provider-agnostic usage metering, multi-asset balances, and configurable billing waterfalls for Python backends."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Financial",
]
keywords = [
    "billing",
    "usage metering",
    "quotas",
    "credits",
    "subscriptions",
    "payments",
    "asyncio",
]
authors = [{ name = "Andrew Gostishchev", email = "contact@arteriali.st" }]

dependencies = []

[project.optional-dependencies]
redis = ["redis>=5.0"]
sqlalchemy = ["sqlalchemy[asyncio]>=2.0"]
fastapi = ["fastapi>=0.110", "starlette>=0.36"]
metrics = ["prometheus-client>=0.20"]
all = [
    "fastapi>=0.110",
    "prometheus-client>=0.20",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "starlette>=0.36",
]

[project.urls]
Homepage = "https://github.com/arterialist/flexibilling"
Documentation = "https://arterialist.github.io/flexibilling/"
Issues = "https://github.com/arterialist/flexibilling/issues"
Source = "https://github.com/arterialist/flexibilling"

[tool.hatch.version]
path = "src/flexibilling/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/flexibilling"]

[tool.hatch.build.targets.sdist]
include = [
    "src/flexibilling",
    "tests",
    "examples",
    "docs",
    "mkdocs.yml",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[dependency-groups]
lint = ["ruff>=0.6", "pyright>=1.1.380"]
testing = [
    "aiosqlite>=0.20",
    "fastapi>=0.110",
    "greenlet>=3.0",
    "prometheus-client>=0.20",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "redis>=5.0",
    "sqlalchemy>=2.0",
]
dev = ["build", "detect-secrets", "mkdocs-material>=9.5,<10", "pre-commit"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4"]
ignore = ["B008"]

[tool.pyright]
include = ["src/flexibilling"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingImports = false
reportMissingTypeStubs = false
reportPrivateImportUsage = false

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
addopts = "--strict-markers --strict-config -q"
testpaths = ["tests"]
markers = ["slow", "integration"]

[tool.coverage.run]
branch = true
source = ["flexibilling"]
